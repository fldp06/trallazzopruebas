<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRALLAZO · Ruleta de Chupitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --morado: #1b0f3a;
    --morado-2: #2a1a5e;
    --rosa: #ff2e7e;
    --amarillo: #ffd23f;
    --turquesa: #0fd9c4;
    --naranja: #ff6b35;
    --texto: #fdf7ff;
    --fondo-1: #ff8a1e;
    --fondo-2: #ff5f1f;
    --fondo-3: #e64d00;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(27,15,58,0.25), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(27,15,58,0.35), transparent 45%),
      linear-gradient(160deg, var(--fondo-1) 0%, var(--fondo-2) 55%, var(--fondo-3) 100%);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  header{
    text-align: center;
    padding: 2.2rem 1rem 0.6rem;
  }

  h1.titulo{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(3rem, 12vw, 5.5rem);
    margin: 0;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(90deg, var(--rosa), var(--amarillo) 45%, var(--turquesa) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px var(--morado);
    filter: drop-shadow(0 4px 0 rgba(27,15,58,0.5));
    transform: rotate(-2deg);
  }

  p.subtitulo{
    margin: 0.4rem 0 0;
    font-size: 1rem;
    letter-spacing: 3px;
    color: rgba(253, 247, 255, 0.6);
  }

  main{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    padding: 1.5rem 1rem 4rem;
  }

  .zona-ruleta{
    position: relative;
    width: min(90vw, 420px);
    height: min(90vw, 420px);
  }

  canvas#ruleta{
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow:
      0 0 0 8px var(--morado-2),
      0 0 0 11px rgba(255, 210, 63, 0.7),
      0 20px 45px rgba(0,0,0,0.5);
    transition: none;
  }

  .logo-central{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    height: 27%;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 5px var(--amarillo), 0 6px 16px rgba(0,0,0,0.45);
    z-index: 4;
    overflow: hidden;
  }

  .logo-central img{
    width: 78%;
    height: 78%;
    object-fit: contain;
  }

  /* --- Estilos de la bola de casino 3D --- */
  .bola {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(14px, 4vw, 22px);
    height: clamp(14px, 4vw, 22px);
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 20%, #888888 60%, #333333 100%);
    border-radius: 50%;
    box-shadow: 
      0 10px 15px rgba(0,0,0,0.5), 
      inset -2px -2px 6px rgba(0,0,0,0.4);
    z-index: 10;
    pointer-events: none;
    opacity: 0; 
    transform: translate(-50%, -50%);
  }

  button#btnGirar{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 1px;
    padding: 0.9rem 3.2rem;
    border: none;
    border-radius: 100px;
    color: var(--morado);
    background: linear-gradient(90deg, var(--amarillo), var(--turquesa));
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.35), 0 14px 30px rgba(15,217,196,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  button#btnGirar:hover{ filter: brightness(1.05); }

  button#btnGirar:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 6px 16px rgba(15,217,196,0.3);
  }

  button#btnGirar:disabled{
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  .overlay-resultado{
    position: fixed;
    inset: 0;
    background: rgba(10, 4, 26, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay-resultado.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .tarjeta-resultado{
    text-align: center;
    padding: 2.5rem 3rem;
    border-radius: 28px;
    background: linear-gradient(160deg, var(--morado-2), var(--morado));
    box-shadow: 0 0 0 6px var(--amarillo), 0 25px 60px rgba(0,0,0,0.6);
    transform: scale(0.7);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .overlay-resultado.visible .tarjeta-resultado{
    transform: scale(1);
  }

  .tarjeta-resultado p.eyebrow{
    margin: 0 0 0.4rem;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--turquesa);
  }

  .tarjeta-resultado h2{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 4rem);
    margin: 0 0 1.6rem;
    color: var(--amarillo);
    text-shadow: 0 0 22px rgba(255,210,63,0.6);
  }

  .tarjeta-resultado button{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.7rem 2rem;
    border: none;
    border-radius: 100px;
    background: var(--rosa);
    color: #fff;
    cursor: pointer;
  }

  footer{
    padding: 1rem;
    font-size: 0.8rem;
    color: rgba(253, 247, 255, 0.4);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1 class="titulo">TRALLAZO</h1>
  <p class="subtitulo">LA RULETA DEL CHUPITO</p>
</header>

<main>
  <div class="zona-ruleta">
    <canvas id="ruleta" width="600" height="600"></canvas>
    
    <div class="logo-central">
      <img src="image.png" alt="Logo de la peña">
    </div>
    
    <!-- Bola animada -->
    <div class="bola" id="bola"></div>
  </div>

  <button id="btnGirar">¡GIRAR!</button>
</main>

<footer>PATROCINADO POR PEÑA TRALLAZO</footer>

<div class="overlay-resultado" id="overlayResultado">
  <div class="tarjeta-resultado">
    <p class="eyebrow">HA TOCADO</p>
    <h2 id="textoResultado">¡TEQUILA!</h2>
    <button id="btnCerrar">Volver a girar</button>
  </div>
</div>

<script>
  const opcionesChupitos = [
    { nombre: "TEQUILA",      color: "#ff2e7e" },
    { nombre: "RON",          color: "#ffd23f" },
    { nombre: "VODKA",        color: "#0fd9c4" },
    { nombre: "WHISKY",       color: "#ff6b35" },
    { nombre: "JÄGERMEISTER", color: "#7b2ff7" },
    { nombre: "GINEBRA",      color: "#00b894" },
    { nombre: "PACHARAN",     color: "#ff4d4d" },
    { nombre: "BOLETUS",      color: "#f54927" }
  ];
  
  const paletaColores = ["#ff2e7e", "#ffd23f", "#0fd9c4", "#ff6b35", "#7b2ff7", "#00b894", "#ff4d4d", "#2ecc71"];

  const canvas = document.getElementById('ruleta');
  const ctx = canvas.getContext('2d');
  const btnGirar = document.getElementById('btnGirar');
  const overlay = document.getElementById('overlayResultado');
  const textoResultado = document.getElementById('textoResultado');
  const btnCerrar = document.getElementById('btnCerrar');
  const bola = document.getElementById('bola');

  const radio = canvas.width / 2;
  const numSectores = opcionesChupitos.length;
  const anguloSector = 360 / numSectores;

  let rotacionAcumulada = 0;
  let girando = false;

  function dibujarRuleta() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    opcionesChupitos.forEach((opcion, i) => {
      const inicio = (i * anguloSector) * Math.PI / 180;
      const fin = ((i + 1) * anguloSector) * Math.PI / 180;
      const color = opcion.color || paletaColores[i % paletaColores.length];

      ctx.beginPath();
      ctx.moveTo(radio, radio);
      ctx.arc(radio, radio, radio - 6, inicio, fin);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1b0f3a";
      ctx.stroke();

      ctx.save();
      ctx.translate(radio, radio);
      ctx.rotate((inicio + fin) / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#1b0f3a";
      ctx.font = "bold 26px 'Baloo 2', sans-serif";
      ctx.fillText(opcion.nombre.toUpperCase(), radio - 34, 10);
      ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(radio, radio, radio - 4, 0, Math.PI * 2);
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#ffd23f";
    ctx.stroke();
  }

  function girarRuleta() {
    if (girando) return;
    girando = true;
    btnGirar.disabled = true;
    bola.style.opacity = 1;

    const duracionMs = 7000; 
    
    // 1. Decidir el ganador aleatoriamente antes de girar
    const indiceGanador = Math.floor(Math.random() * numSectores);
    
    // 2. Calcular rotación de la ruleta
    const vueltasRuleta = 5 + Math.floor(Math.random() * 3);
    const extra = Math.random() * 360;
    const rotacionInicial = rotacionAcumulada;
    const rotacionObjetivo = rotacionInicial + vueltasRuleta * 360 + extra;
    const diferencia = rotacionObjetivo - rotacionInicial;
    
    // 3. Calcular dónde debe terminar la bola exactamente (en el centro del sector ganador)
    const anguloCentroSector = (indiceGanador * anguloSector) + (anguloSector / 2);
    const anguloFinalBola = rotacionObjetivo + anguloCentroSector;
    
    const tiempoInicio = performance.now();

    // Curva de frenado suave
    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

    function frame(ahora) {
      const transcurrido = ahora - tiempoInicio;
      const t = Math.min(transcurrido / duracionMs, 1);
      const tSuavizado = easeOutQuart(t);

      // Rotar la rueda (sentido horario)
      rotacionAcumulada = rotacionInicial + diferencia * tSuavizado;
      canvas.style.transform = `rotate(${rotacionAcumulada}deg)`;

      // FÍSICAS DE LA BOLA
      // 1. Ángulo: Empieza girando rápido en sentido contrario y frena hasta alinearse con el sector
      const anguloBolaActual = anguloFinalBola - (1 - tSuavizado) * 360 * 12; // 12 vueltas de bola
      const radianes = anguloBolaActual * Math.PI / 180;

      // 2. Radio: Empieza en el borde exterior (46%) y cae al interior (27%) al final
      let radioPorcentaje = 46; 
      if (tSuavizado > 0.5) {
        // En la segunda mitad del tiempo, la bola empieza a caer hacia el centro
        const caida = (tSuavizado - 0.5) / 0.5;
        radioPorcentaje = 46 - (caida * 19); 
      }

      // 3. Efecto 3D de rebote: Modificando la escala para simular altura
      let escala = 1;
      if (tSuavizado > 0.4 && tSuavizado < 0.95) {
        // Rebotes rápidos que van perdiendo fuerza
        const rebotes = Math.max(0, Math.sin(tSuavizado * Math.PI * 30)); 
        const perdidaFuerza = 1 - tSuavizado;
        escala = 1 + (rebotes * perdidaFuerza * 1.5); 
      }

      // 4. Posicionar la bola
      const bolaX = Math.cos(radianes) * radioPorcentaje;
      const bolaY = Math.sin(radianes) * radioPorcentaje;
      
      bola.style.left = `calc(50% + ${bolaX}%)`;
      bola.style.top = `calc(50% + ${bolaY}%)`;
      bola.style.transform = `translate(-50%, -50%) scale(${escala})`;

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        girando = false;
        btnGirar.disabled = false;
        mostrarResultado(opcionesChupitos[indiceGanador].nombre);
      }
    }

    requestAnimationFrame(frame);
  }

  function mostrarResultado(nombre) {
    textoResultado.textContent = `¡${nombre}!`;
    overlay.classList.add('visible');
  }

  function cerrarResultado() {
    overlay.classList.remove('visible');
  }

  btnGirar.addEventListener('click', girarRuleta);
  btnCerrar.addEventListener('click', cerrarResultado);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) cerrarResultado();
  });

  dibujarRuleta();
</script>

</body>
</html>
