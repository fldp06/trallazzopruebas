<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRALLAZO · Ruleta de Chupitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --morado: #1b0f3a;
    --morado-2: #2a1a5e;
    --rosa: #ff2e7e;
    --amarillo: #ffd23f;
    --turquesa: #0fd9c4;
    --naranja: #ff6b35;
    --texto: #fdf7ff;
    /* Colores de la peña: naranja como base del fondo */
    --fondo-1: #ff8a1e;
    --fondo-2: #ff5f1f;
    --fondo-3: #e64d00;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(27,15,58,0.25), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(27,15,58,0.35), transparent 45%),
      linear-gradient(160deg, var(--fondo-1) 0%, var(--fondo-2) 55%, var(--fondo-3) 100%);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ---------- Encabezado ---------- */
  header{
    text-align: center;
    padding: 2.2rem 1rem 0.6rem;
  }

  h1.titulo{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(3rem, 12vw, 5.5rem);
    margin: 0;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(90deg, var(--rosa), var(--amarillo) 45%, var(--turquesa) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px var(--morado);
    filter: drop-shadow(0 4px 0 rgba(27,15,58,0.5));
    transform: rotate(-2deg);
  }

  p.subtitulo{
    margin: 0.4rem 0 0;
    font-size: 1rem;
    letter-spacing: 3px;
    color: rgba(253, 247, 255, 0.6);
  }

  /* ---------- Zona de la ruleta ---------- */
  main{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 1.5rem 1rem 4rem;
  }

  /* Contenedor con perspectiva: es lo que da la sensación 3D.
     Todo lo que hay dentro de .plato-3d se dibuja "plano" (canvas 2D
     normal) pero el navegador lo proyecta en perspectiva gracias a
     estas dos propiedades, como si miráramos la ruleta desde arriba. */
  .zona-ruleta{
    position: relative;
    width: min(94vw, 560px);
    height: min(94vw, 560px);
    perspective: 1400px;
  }

  /* Sombra de "mesa" bajo la ruleta para reforzar la sensación de volumen */
  .zona-ruleta::after{
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: -6%;
    height: 22%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 70%);
    z-index: -1;
    filter: blur(4px);
  }

  .plato-3d{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(22deg);
  }

  canvas#ruleta{
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 30px 40px rgba(0,0,0,0.55);
  }

  .logo-central{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    height: 27%;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 5px var(--amarillo), 0 6px 16px rgba(0,0,0,0.45);
    z-index: 4;
    overflow: hidden;
  }

  .logo-central img{
    width: 78%;
    height: 78%;
    object-fit: contain;
  }

  /* ---------- Botón Girar ---------- */
  button#btnGirar{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 1px;
    padding: 0.9rem 3.2rem;
    border: none;
    border-radius: 100px;
    color: var(--morado);
    background: linear-gradient(90deg, var(--amarillo), var(--turquesa));
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.35), 0 14px 30px rgba(15,217,196,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  button#btnGirar:hover{ filter: brightness(1.05); }

  button#btnGirar:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 6px 16px rgba(15,217,196,0.3);
  }

  button#btnGirar:disabled{
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  button#btnGirar:focus-visible{
    outline: 3px solid var(--rosa);
    outline-offset: 4px;
  }

  /* ---------- Aviso de resultado ---------- */
  .overlay-resultado{
    position: fixed;
    inset: 0;
    background: rgba(10, 4, 26, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay-resultado.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .tarjeta-resultado{
    text-align: center;
    padding: 2.5rem 3rem;
    border-radius: 28px;
    background: linear-gradient(160deg, var(--morado-2), var(--morado));
    box-shadow: 0 0 0 6px var(--amarillo), 0 25px 60px rgba(0,0,0,0.6);
    transform: scale(0.7);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .overlay-resultado.visible .tarjeta-resultado{
    transform: scale(1);
  }

  .tarjeta-resultado p.eyebrow{
    margin: 0 0 0.4rem;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--turquesa);
  }

  .tarjeta-resultado h2{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 4rem);
    margin: 0 0 1.6rem;
    color: var(--amarillo);
    text-shadow: 0 0 22px rgba(255,210,63,0.6);
  }

  .tarjeta-resultado button{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.7rem 2rem;
    border: none;
    border-radius: 100px;
    background: var(--rosa);
    color: #fff;
    cursor: pointer;
  }

  footer{
    padding: 1rem;
    font-size: 0.8rem;
    color: rgba(253, 247, 255, 0.4);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    .plato-3d{ transform: none; }
    .tarjeta-resultado{ transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1 class="titulo">TRALLAZO</h1>
  <p class="subtitulo">LA RULETA DEL CHUPITO</p>
</header>

<main>
  <div class="zona-ruleta">
    <!-- .plato-3d es el elemento inclinado en 3D (perspective + rotateX).
         Todo lo que va dentro (canvas de la ruleta + logo) hereda esa
         inclinación, dando el efecto de mesa de casino vista en ángulo. -->
    <div class="plato-3d">
      <canvas id="ruleta" width="700" height="700"></canvas>
      <div class="logo-central">
        <img src="image.png" alt="Logo de la peña">
      </div>
    </div>
  </div>

  <button id="btnGirar">¡GIRAR!</button>
</main>

<footer>PATROCINADO POR PEÑA TRALLAZO</footer>

<!-- Aviso de resultado -->
<div class="overlay-resultado" id="overlayResultado">
  <div class="tarjeta-resultado">
    <p class="eyebrow">HA TOCADO</p>
    <h2 id="textoResultado">¡TEQUILA!</h2>
    <button id="btnCerrar">Volver a girar</button>
  </div>
</div>

<script>
  /* =========================================================================
     CONFIGURACIÓN DE LA RULETA
     -------------------------------------------------------------------------
     Para AÑADIR o QUITAR bebidas, edita el array "opcionesChupitos" de abajo.
     - nombre -> texto que aparece en el sector y en el aviso final
     - color  -> color de fondo del sector (hexadecimal)
     ========================================================================= */
  const opcionesChupitos = [
    { nombre: "TEQUILA",      color: "#ff2e7e" },
    { nombre: "PLATA",          color: "#ffd23f" },
    { nombre: "VODKA",        color: "#0fd9c4" },
    { nombre: "WHISKY",       color: "#ff6b35" },
    { nombre: "JÄGERMEISTER", color: "#7b2ff7" },
    { nombre: "SOL Y SOMBRA",      color: "#00b894" },
    { nombre: "PACHARAN",     color: "#ff4d4d" },
    { nombre: "BOLETUS",      color: "#f54927" }
  ];
  // Paleta de repuesto por si algún objeto no trae "color" definido
  const paletaColores = ["#ff2e7e", "#ffd23f", "#0fd9c4", "#ff6b35", "#7b2ff7", "#00b894", "#ff4d4d", "#2ecc71"];

  /* ========================================================================= */

  const canvas = document.getElementById('ruleta');
  const ctx = canvas.getContext('2d');
  const btnGirar = document.getElementById('btnGirar');
  const overlay = document.getElementById('overlayResultado');
  const textoResultado = document.getElementById('textoResultado');
  const btnCerrar = document.getElementById('btnCerrar');

  const centro = canvas.width / 2;           // 300: centro del canvas (también el eje de giro)
  const numSectores = opcionesChupitos.length;
  const anguloSector = 360 / numSectores;

  /* -------------------------------------------------------------------------
     GEOMETRÍA DEL PLATO
     El plato tiene dos partes bien diferenciadas, como en una ruleta real:
       - La "bola" (aro de madera + metal + deflectores): es FIJA, no gira.
       - La "rueda" (sectores de colores con los nombres): SÍ gira.
     ------------------------------------------------------------------------- */
  const radioBowlExt   = centro * 0.99;  // borde exterior (madera oscura)
  const radioBowlInt   = centro * 0.89;  // aro dorado que separa madera de pista
  const radioPista     = centro * 0.82;  // radio donde "rueda" la bola al principio
  const radioDiamantes = centro * 0.745; // radio de los deflectores metálicos fijos
  const radioRueda     = centro * 0.68;  // borde exterior de la rueda giratoria
  const radioReposo    = radioRueda * 0.7; // radio donde la bola queda encajada
  const radioCubo      = centro * 0.29;  // aro metálico alrededor del logo central
  const numDiamantes   = 8;              // nº de deflectores fijos en la pista

  /* -------------------------------------------------------------------------
     MARCADOR FIJO (la "aguja" de la ruleta)
     La bola SIEMPRE termina cayendo exactamente en este ángulo absoluto,
     que no cambia nunca. El sector ganador es, por definición, el que la
     rueda deja bajo este punto al detenerse. Así, el resultado anunciado
     y el sitio donde "se ve" caer la bola son la misma cosa por
     construcción: no hay manera de que se desincronicen.
     ------------------------------------------------------------------------- */
  const ANGULO_MARCADOR = 270; // arriba del todo (las 12 en punto)

  let girando = false;

  /* --------------------------------------------------------------------- */
  /* 1) PARTE FIJA: aro exterior + pista + deflectores (no gira nunca)     */
  /* --------------------------------------------------------------------- */
  function dibujarDiamante(x, y, anguloRad) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(anguloRad);
    const s = 9;
    const brillo = ctx.createLinearGradient(-s, -s, s, s);
    brillo.addColorStop(0, "#fff6d6");
    brillo.addColorStop(0.5, "#d4af37");
    brillo.addColorStop(1, "#7a5c14");
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
    ctx.closePath();
    ctx.fillStyle = brillo;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.stroke();
    ctx.restore();
  }

  // Flecha fija que señala ANGULO_MARCADOR: nunca gira, es el punto de
  // referencia visual de "aquí es donde cae la bola".
  function dibujarMarcador() {
    const anguloRad = ANGULO_MARCADOR * Math.PI / 180;
    ctx.save();
    ctx.translate(centro, centro);
    ctx.rotate(anguloRad);
    const puntaX = radioRueda - 4;
    const baseX = radioBowlInt + 6;
    const semiancho = 10;
    ctx.beginPath();
    ctx.moveTo(puntaX, 0);
    ctx.lineTo(baseX, -semiancho);
    ctx.lineTo(baseX, semiancho);
    ctx.closePath();
    ctx.fillStyle = "#ffd23f";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#1b0f3a";
    ctx.stroke();
    ctx.restore();
  }

  function dibujarBowlEstatica() {
    // Aro exterior, símil madera oscura
    ctx.beginPath();
    ctx.arc(centro, centro, radioBowlExt, 0, Math.PI * 2);
    const madera = ctx.createRadialGradient(centro, centro, radioBowlInt, centro, centro, radioBowlExt);
    madera.addColorStop(0, "#4a2a12");
    madera.addColorStop(1, "#2a1608");
    ctx.fillStyle = madera;
    ctx.fill();

    // Aro dorado decorativo
    ctx.beginPath();
    ctx.arc(centro, centro, radioBowlInt, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#d4af37";
    ctx.stroke();

    // Pista por la que corre la bola (anillo metálico/madera claro)
    ctx.beginPath();
    ctx.arc(centro, centro, (radioBowlInt + radioDiamantes) / 2, 0, Math.PI * 2);
    ctx.lineWidth = radioBowlInt - radioDiamantes;
    ctx.strokeStyle = "#6b4a26";
    ctx.stroke();

    // Deflectores metálicos fijos, repartidos en la pista
    for (let i = 0; i < numDiamantes; i++) {
      const ang = (i * 360 / numDiamantes) * Math.PI / 180;
      const x = centro + radioDiamantes * Math.cos(ang);
      const y = centro + radioDiamantes * Math.sin(ang);
      dibujarDiamante(x, y, ang);
    }

    dibujarMarcador();
  }

  /* --------------------------------------------------------------------- */
  /* 2) PARTE GIRATORIA: sectores de colores + separadores + texto         */
  /* --------------------------------------------------------------------- */
  function dibujarRuedaGiratoria(rotacionGrados) {
    ctx.save();
    ctx.translate(centro, centro);
    ctx.rotate(rotacionGrados * Math.PI / 180);
    ctx.translate(-centro, -centro);

    opcionesChupitos.forEach((opcion, i) => {
      const inicio = (i * anguloSector) * Math.PI / 180;
      const fin = ((i + 1) * anguloSector) * Math.PI / 180;
      const color = opcion.color || paletaColores[i % paletaColores.length];

      // Sector de color
      ctx.beginPath();
      ctx.moveTo(centro, centro);
      ctx.arc(centro, centro, radioRueda, inicio, fin);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      // Separador metálico entre sectores (el "tope" contra el nombre)
      ctx.save();
      ctx.translate(centro, centro);
      ctx.rotate(inicio);
      ctx.beginPath();
      ctx.moveTo(radioCubo, 0);
      ctx.lineTo(radioRueda, 0);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#d4af37";
      ctx.stroke();
      ctx.restore();

      // Nombre de la bebida
      ctx.save();
      ctx.translate(centro, centro);
      ctx.rotate((inicio + fin) / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#1b0f3a";
      const textoNombre = opcion.nombre.toUpperCase();
      const anchoDisponible = (radioRueda - 14) - (radioCubo + 6);
      let tamanoFuente = 20;
      ctx.font = `bold ${tamanoFuente}px 'Baloo 2', sans-serif`;
      while (ctx.measureText(textoNombre).width > anchoDisponible && tamanoFuente > 11) {
        tamanoFuente -= 1;
        ctx.font = `bold ${tamanoFuente}px 'Baloo 2', sans-serif`;
      }
      ctx.fillText(textoNombre, radioRueda - 10, 5);
      ctx.restore();
    });

    // Aro exterior de la rueda giratoria
    ctx.beginPath();
    ctx.arc(centro, centro, radioRueda, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#1b0f3a";
    ctx.stroke();

    // Cubo metálico central (asoma justo alrededor del logo)
    ctx.beginPath();
    ctx.arc(centro, centro, radioCubo, 0, Math.PI * 2);
    ctx.fillStyle = "#d4af37";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#7a5c14";
    ctx.stroke();

    ctx.restore();
  }

  /* --------------------------------------------------------------------- */
  /* 3) LA BOLA                                                             */
  /* --------------------------------------------------------------------- */
  function dibujarBola(anguloGrados, radioPx, alturaPx) {
    const anguloRad = anguloGrados * Math.PI / 180;
    const x = centro + radioPx * Math.cos(anguloRad);
    const y = centro + radioPx * Math.sin(anguloRad);
    const radioBolita = 9;

    // Sombra proyectada (se encoge cuanto más "salta" la bola)
    const escalaSombra = 1 - Math.min(alturaPx / 18, 0.6);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y + 2, radioBolita * 0.9 * escalaSombra, radioBolita * 0.45 * escalaSombra, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fill();
    ctx.restore();

    // La bola, desplazada hacia arriba según su "altura" (efecto 3D)
    const yBola = y - alturaPx;
    const brillo = ctx.createRadialGradient(
      x - radioBolita * 0.35, yBola - radioBolita * 0.35, radioBolita * 0.1,
      x, yBola, radioBolita
    );
    brillo.addColorStop(0, "#ffffff");
    brillo.addColorStop(0.5, "#f1f1f1");
    brillo.addColorStop(1, "#9a9a9a");

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, yBola, radioBolita, 0, Math.PI * 2);
    ctx.fillStyle = brillo;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.stroke();
    ctx.restore();
  }

  /* --------------------------------------------------------------------- */
  /* Utilidades de easing y ángulos                                        */
  /* --------------------------------------------------------------------- */
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function normalizar360(g) { return ((g % 360) + 360) % 360; }

  // Estado persistente entre giros (para que el movimiento siempre
  // continúe desde donde se quedaron la rueda y la bola)
  let rotacionRuedaActual = 0;
  let anguloBolaActual = ANGULO_MARCADOR; // la bola siempre reposa en el marcador

  /* --------------------------------------------------------------------- */
  /* LÓGICA DEL GIRO                                                        */
  /* -------------------------------------------------------------------------
     DISEÑO: en vez de que la bola tenga que "encontrarse" en pleno vuelo
     con un sector que se está moviendo (lo que obligaba a predecir dónde
     estaría la rueda en un instante futuro exacto, y era muy fácil de
     desincronizar), aquí el ganador se decide de otra forma, imposible
     de desajustar:

       1. Se elige el sector ganador (un ángulo LOCAL, dentro de la rueda).
       2. Se calcula la rotación final EXACTA que debe tener la rueda para
          que ese sector quede justo bajo ANGULO_MARCADOR al detenerse.
       3. La bola, de forma totalmente independiente, viaja por su pista
          y siempre termina en ese mismo ANGULO_MARCADOR, que es una
          constante fija, no un objetivo que se mueve.

     Como el destino de la bola nunca depende de dónde esté la rueda en
     cada instante, ya no hace falta ninguna sincronización: cuando ambas
     animaciones terminan (mismo t=1), coinciden por definición.
     ------------------------------------------------------------------------- */
  function girarRuleta() {
    if (girando) return;
    girando = true;
    btnGirar.disabled = true;
    overlay.classList.remove('visible');

    // 1) Sector ganador (ángulo LOCAL, dentro del sistema de la rueda).
    const indiceGanador = Math.floor(Math.random() * numSectores);
    const centroSector = (indiceGanador + 0.5) * anguloSector;
    const margen = anguloSector * 0.28; // no tocar los bordes del sector
    const anguloObjetivoLocal = normalizar360(centroSector + (Math.random() * 2 - 1) * margen);

    // 2) Rotación final EXACTA de la rueda para que ese sector quede bajo
    //    el marcador fijo. "ajusteRueda" es la parte fraccionaria (0-360)
    //    y le sumamos varias vueltas completas sólo para que se vea bien.
    const duracionMs = 7200;
    const vueltasRueda = 4 + Math.floor(Math.random() * 3); // 4, 5 o 6 vueltas completas
    const rotacionRuedaInicio = rotacionRuedaActual;
    const ajusteRueda = normalizar360(ANGULO_MARCADOR - anguloObjetivoLocal - rotacionRuedaInicio);
    const deltaRueda = vueltasRueda * 360 + ajusteRueda;
    const rotacionRuedaFinal = rotacionRuedaInicio + deltaRueda;
    // Comprobación: normalizar360(anguloObjetivoLocal + rotacionRuedaFinal) === ANGULO_MARCADOR

    function rotacionRueda(t) {
      return rotacionRuedaInicio + deltaRueda * easeOutCubic(t);
    }

    // 3) Recorrido de LA BOLA: viaja en sentido ANTIHORARIO por su pista y
    //    su destino es siempre ANGULO_MARCADOR (constante, no depende de t).
    const p1 = 0.45; // hasta aquí: crucero rápido por la pista exterior
    const p2 = 0.86; // hasta aquí: caída y rebote; después, reposo total

    const vueltasBola = 8 + Math.floor(Math.random() * 4); // 8 a 11 vueltas completas
    const anguloBolaInicio = anguloBolaActual;
    const inicioNormalizado = normalizar360(anguloBolaInicio);
    const ajusteBola = normalizar360(inicioNormalizado - ANGULO_MARCADOR);
    const diferenciaTotal = -(vueltasBola * 360 + ajusteBola);
    // Comprobación: normalizar360(anguloBolaInicio + diferenciaTotal) === ANGULO_MARCADOR

    // Repartimos ese recorrido en dos tramos que se enlazan sin salto: el
    // 90% de las vueltas en la fase de crucero (t<=p1) y el 10% restante
    // en la fase de caída (p1..p2), donde frena del todo hasta pararse.
    const diferenciaFase1 = diferenciaTotal * 0.9;
    const diferenciaFase2 = diferenciaTotal - diferenciaFase1;
    const anguloFinFase1 = anguloBolaInicio + diferenciaFase1;

    const tiempoInicio = performance.now();

    function frame(ahora) {
      const transcurrido = ahora - tiempoInicio;
      const t = Math.min(transcurrido / duracionMs, 1);

      // --- Rotación de la rueda ---
      const rotRueda = rotacionRueda(t);

      // --- Ángulo absoluto de la bola: SIEMPRE converge a ANGULO_MARCADOR ---
      let anguloBolaAbs;
      if (t <= p1) {
        // Fase de crucero: arranca rápido y va frenando poco a poco, sin
        // llegar a pararse del todo (le queda margen para la caída).
        const localA = t / p1;
        anguloBolaAbs = anguloBolaInicio + diferenciaFase1 * Math.pow(localA, 0.6);
      } else if (t <= p2) {
        // Fase de caída: parte de donde terminó el crucero (sin salto) y
        // frena de forma continua hasta pararse justo en el marcador. El
        // rebote decae a 0 exactamente cuando localB llega a 1, así que
        // el frenado final siempre es suave.
        const localB = (t - p1) / (p2 - p1);
        const angulo = anguloFinFase1 + diferenciaFase2 * easeOutCubic(localB);
        const rebote = 6 * (1 - localB) * Math.sin(localB * 14 * Math.PI);
        anguloBolaAbs = angulo + rebote;
      } else {
        // Fase de reposo: ya frenó del todo, se queda fija en el marcador.
        anguloBolaAbs = ANGULO_MARCADOR;
      }

      // --- Radio de la bola: pista -> caída con rebotes -> reposo fijo ---
      let radioBola;
      if (t <= p1) {
        radioBola = radioPista + Math.sin(t * 70) * 2.5; // ligero balanceo en la pista
      } else if (t <= p2) {
        const localB = (t - p1) / (p2 - p1);
        const caidaPrincipal = radioPista + (radioReposo - radioPista) * easeInOutCubic(localB);
        const reboteRadio = 10 * (1 - localB) * Math.abs(Math.sin(localB * 16 * Math.PI));
        radioBola = caidaPrincipal + reboteRadio;
      } else {
        radioBola = radioReposo; // ya encajada
      }

      // --- Altura (efecto 3D de bote), solo durante la caída ---
      let alturaBola = 0;
      if (t > p1 && t <= p2) {
        const localB = (t - p1) / (p2 - p1);
        alturaBola = 10 * (1 - localB) * Math.abs(Math.sin(localB * 16 * Math.PI));
      }

      // --- Dibujado del fotograma completo ---
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dibujarBowlEstatica();
      dibujarRuedaGiratoria(rotRueda);
      dibujarBola(anguloBolaAbs, radioBola, alturaBola);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        // Rueda y bola terminan a la vez, ambas en el marcador fijo:
        // anunciamos el resultado en el mismo instante.
        rotacionRuedaActual = normalizar360(rotacionRuedaFinal);
        anguloBolaActual = ANGULO_MARCADOR;
        girando = false;
        btnGirar.disabled = false;
        mostrarResultado(opcionesChupitos[indiceGanador].nombre);
      }
    }

    requestAnimationFrame(frame);
  }

  // --- Muestra el aviso central con el chupito ganador ---
  function mostrarResultado(nombre) {
    textoResultado.textContent = `¡${nombre}!`;
    overlay.classList.add('visible');
  }

  function cerrarResultado() {
    overlay.classList.remove('visible');
  }

  btnGirar.addEventListener('click', girarRuleta);
  btnCerrar.addEventListener('click', cerrarResultado);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) cerrarResultado();
  });

  // Dibujo inicial: plato en reposo, con la bola ya encajada
  dibujarBowlEstatica();
  dibujarRuedaGiratoria(rotacionRuedaActual);
  dibujarBola(anguloBolaActual, radioReposo, 0);
</script>
